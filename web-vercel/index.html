<style>
  :root {
    --cream:#F4F4EF; --card:#FFFFFF; --green:#4C7A33; --green-deep:#335E22;
    --ink:#22281D; --body:#474A41; --muted:#8A8A7E; --line:#E7E7DF; color-scheme:light;
    --f-display:"Bricolage Grotesque",system-ui,sans-serif; --f-body:"Hanken Grotesk",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --cream:#1C1E19; --card:#25271F; --green:#6FA255; --green-deep:#8FBE73; --ink:#ECE7D9; --body:#D3CCBD; --muted:#9A9284; --line:#383A2F; color-scheme:dark; } }
  :root[data-theme="dark"]{ --cream:#1C1E19; --card:#25271F; --green:#6FA255; --green-deep:#8FBE73; --ink:#ECE7D9; --body:#D3CCBD; --muted:#9A9284; --line:#383A2F; color-scheme:dark; }
  *{box-sizing:border-box;}
  body{ background:var(--cream); color:var(--body); font-family:var(--f-body); line-height:1.55; min-height:100%;
    padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:32px; display:flex; align-items:center; justify-content:center; }
  .card{ width:100%; max-width:460px; background:var(--card); border:1px solid var(--line); border-radius:22px;
    box-shadow:0 18px 50px -24px rgba(40,45,30,.28); padding:30px 26px 34px; text-align:center; }
  .logo{ width:min(230px,72%); height:auto; border-radius:10px; margin-bottom:20px; }
  h1{ font-family:var(--f-display); font-weight:700; color:var(--green-deep); font-size:1.5rem; letter-spacing:-.01em; margin:0 0 10px; }
  p{ color:var(--body); margin:0 0 8px; font-size:.97rem; }
  p.lang{ color:var(--muted); font-size:.9rem; margin-top:6px; }
  .rule{ height:1px; background:var(--line); margin:20px 0; }
  a.ig{ display:inline-flex; align-items:center; gap:8px; margin-top:10px; color:#fff; text-decoration:none; font-weight:700; font-size:.9rem;
    background:linear-gradient(45deg,#feda75,#fa7e1e 30%,#d62976 60%,#962fbf 85%,#4f5bd5); padding:9px 16px; border-radius:999px; }
  a.ig svg{ width:17px; height:17px; }
</style>
